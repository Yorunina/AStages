name: Test Secret

on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check if CURSEFORGE_TOKEN exists
        run: |
          if [ -z "${{ secrets.CURSEFORGE_TOKEN }}" ]; then
            echo "❌ Secret CURSEFORGE_TOKEN not found!"
            exit 1
          else
            echo "✅ Secret CURSEFORGE_TOKEN is set."
          fi