name: Test Secret

on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check if CURSEFORGE_API_KEY exists
        run: |
          if [ -z "${{ secrets.CURSEFORGE_API_KEY }}" ]; then
            echo "❌ Secret CURSEFORGE_API_KEY not found!"
            exit 1
          else
            echo "✅ Secret CURSEFORGE_API_KEY is set."
          fi