name: Tag
on: [workflow_dispatch]

jobs:
  build_changelog:
    environment: Token
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest stable tag
        id: latest_tag
        run: |
          TAG=$(git tag --list 'v*' \
            | grep -Ev 'alpha|beta|rc' \
            | sort -V \
            | tail -n 1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Use tag
        run: echo "Latest stable tag is ${{ steps.latest_tag.outputs.tag }}"