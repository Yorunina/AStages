name: Changelog Builder Action
on: [workflow_dispatch]

jobs:
  build_changelog:
    environment: Token
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: echo "version=2.0.0-alpha.6" >> $GITHUB_OUTPUT

      - name: Set date
        id: date
        run: echo "today=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: "Complex Configuration"
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: "configuration_complex.json"
          # repo: "AStages"
          ignorePreReleases: false
          fetchViaCommits: true
          fromTag: "v2.0.0-alpha.3"
          toTag: "HEAD"
          # fromTag: "v2.0.0-alpha.3"
          # toTag: "v2.0.0-alpha.5"
          token: ${{ secrets.GITHUB_TOKEN }}
          outputFile: "CHANGELOG.md"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DATE: ${{ steps.date.outputs.today }}

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md