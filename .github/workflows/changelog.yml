name: Changelog
on: [workflow_dispatch]

jobs:
  build_changelog:
    environment: Token
    runs-on: ubuntu-latest

    steps:
      - name: Generate release changelog
        id: changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: CHANGELOG.md
          pullRequests: true
          issues: true
          unreleased: true
          addSections: |
            {
              "API": ["api"],
              "Added": ["added", "feature"],
              "Removed": ["removed"],
              "Fixed": ["bug", "fix"],
              "Compatibility": ["compatibility", "integration"],
              "Internal": ["internal", "refactor"]
            }