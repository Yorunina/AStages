name: Changelog
on: [workflow_dispatch]

jobs:
  build_changelog:
    environment: Token
    runs-on: ubuntu-latest

    steps:
      - name: Generate release changelog
        id: changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: CHANGELOG.md
          pullRequests: true
#          issues: true
          unreleased: true
          unreleasedOnly: true
          stripGeneratorNotice: true
          author: false
          configureSections: |
            {
              "API": {
                "labels": ["api"]
              },
              "Added": {
                "labels": ["feat"]
              },
              "Removed": {
                "labels": ["removed"]
              },
              "Fixed": {
                "labels": ["fix"]
              },
              "Performance Improvements": {
                "labels": ["perf"]
              }
            }

      - name: Remove "Merged pull requests" header
        run: |
          sed -i '/^\*\*Merged pull requests:\*\*/d' CHANGELOG.md

      - name: Remove "Full Changelog" lines
        run: |
          sed -i '/Full Changelog/d' CHANGELOG.md

#      - name: Clean PR titles
#        run: |
#          sed -i 's/^-\s*api:\s*/- /i' CHANGELOG.md
#          sed -i 's/^-\s*fix:\s*/- /i' CHANGELOG.md
#          sed -i 's/^-\s*feat:\s*/- /i' CHANGELOG.md
#          sed -i 's/^-\s*removed:\s*/- /i' CHANGELOG.md
#          sed -i 's/^-\s*perf:\s*/- /i' CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md