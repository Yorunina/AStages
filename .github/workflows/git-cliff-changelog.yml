name: Generate Changelog

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Starting Commit/Tag (es. v1.3.0 o SHA)"
        required: false
        default: ""

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create .cliff.env for git-cliff 3.0
        run: |
          echo "VERSION=${{ steps.version.outputs.version }}" > .cliff.env
          cat .cliff.env

      - name: Install git-cliff 3.0.0
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@3.0.0

      - name: Generate CHANGELOG.md
        run: |
          if [ -z "${{ github.event.inputs.from }}" ]; then
            echo "Generating changelog from start"
            git-cliff --config .cliff.toml --output CHANGELOG.md
          else
            echo "Generating changelog from: ${{ github.event.inputs.from }}"
            git-cliff --config .cliff.toml \
                       ${{ github.event.inputs.from }}..HEAD \
                       --output CHANGELOG.md
          fi

      - name: Commit and push CHANGELOG
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update changelog for version ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push || echo "Nothing to push"
