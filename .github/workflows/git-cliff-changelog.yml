name: Generate Changelog

on:
  workflow_dispatch:
    inputs:
      start-ref:
        description: "First tag/commit for changelog generation"
        required: true

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(grep "^version" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: |
          git-cliff \
            --config cliff.toml \
            --context VERSION=${{ steps.version.outputs.version }} \
            "${{ github.event.inputs.start-ref }}".. \
            --output CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for version ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push
