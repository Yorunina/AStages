name: Feature Request
description: Request a new feature/enhancement for AStages
labels: [ feature request / addon ]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional info
      description: Why should this be considered? Are there any alternatives?